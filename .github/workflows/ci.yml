name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r infra/requirements.txt

      - name: Lint
        run: ruff check .

      - name: Simulator tests
        run: pytest

      - name: CDK stack tests
        working-directory: infra
        run: pytest test_storage_stack.py
